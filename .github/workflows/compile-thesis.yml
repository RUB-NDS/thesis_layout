# This workflow will run a docker image with a full TeXLive environment installed and compile the thesis to look for errors

name: Document Build

# Controls when the action will run.
on:
  # Triggers the workflow on push to master or v2026 and on pull requests to master
  push:
    branches: [ master, v2026 ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Compile the thesis
      - name: Compile thesis
        uses: xu-cheng/latex-action@v4
        with:
          root_file: thesis.tex
          latexmk_shell_escape: true # necessary for minted package
          docker_image: ghcr.io/chearix/vscode-devcontainer-latex:2026

      # Make the built PDF available for download
      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: thesis.pdf
          if-no-files-found: error